<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meadow Bot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d6a3; }
      canvas { display: block; }
      #hint {
        position: fixed; left: 16px; bottom: 16px; max-width: calc(100vw - 420px); box-sizing: border-box;
        font: 13px/1.5 system-ui, sans-serif; color: #fff;
        background: rgba(30, 40, 20, 0.45); padding: 8px 12px; border-radius: 8px;
        pointer-events: none; backdrop-filter: blur(4px); transition: opacity 0.6s;
      }
      #hint.dim { opacity: 0.55; }
      #hint:empty { display: none; }
      /* Bottom-right controls: the way to the other scene, and settings. */
      #controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 12px; }
      #controls svg { width: 20px; height: 20px; }
      #scene {
        height: 44px; padding: 0 16px;
        font: 14px system-ui, sans-serif; border: 0; border-radius: 22px; cursor: pointer;
        background: rgba(30, 40, 20, 0.45); color: #fff; backdrop-filter: blur(4px);
      }
      #minimap {
        position: fixed; left: 16px; top: 22px; padding: 6px; border-radius: 18px;
        background: #fff6e2; box-shadow: 0 0 0 3px #8a6a3e, 0 6px 16px rgba(40, 28, 10, 0.35);
        transition: opacity 0.3s, transform 0.3s;
      }
      #minimap canvas { display: block; border-radius: 12px; cursor: pointer; }
      #minimap.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
      #minimap .ribbon {
        position: absolute; left: 50%; top: -14px; transform: translateX(-50%);
        padding: 3px 16px; border-radius: 12px; white-space: nowrap;
        font: 800 13px "PingFang TC", "Heiti TC", system-ui, sans-serif; letter-spacing: 2px;
        color: #fff8e6; background: #d2643a; box-shadow: 0 0 0 2px #8a3a1e, 0 2px 0 2px rgba(80, 30, 10, 0.4);
      }
      #minimap .compass {
        position: absolute; right: 12px; top: 12px; width: 22px; height: 22px; border-radius: 50%;
        font: 900 11px system-ui, sans-serif; line-height: 22px; text-align: center; z-index: 1;
        color: #d2643a; background: #fff6e2; box-shadow: 0 0 0 2px #8a6a3e; pointer-events: none;
      }
      /* Scavenging: radar pill, find card and collection book, in the minimap's style. */
      #radar {
        position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 14px 0 10px;
        border: 0; border-radius: 17px; cursor: pointer; background: #fff6e2;
        box-shadow: 0 0 0 3px #8a6a3e, 0 4px 12px rgba(40, 28, 10, 0.3);
        font: 800 13px "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #6a4a26;
      }
      #radar .dish { display: grid; }
      #radar .dish svg { width: 18px; height: 18px; }
      #radar .bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
      #radar .bars i { width: 5px; border-radius: 2px; background: #e2d4b4; transition: background 0.2s; }
      #radar .bars i:nth-child(1) { height: 5px; } #radar .bars i:nth-child(2) { height: 8px; }
      #radar .bars i:nth-child(3) { height: 11px; } #radar .bars i:nth-child(4) { height: 14px; }
      #radar .bars i:nth-child(5) { height: 16px; }
      #radar .bars i.on { background: #6fae3e; }
      #radar.hot .bars i.on { background: #e0702e; }
      #toast {
        position: fixed; left: 50%; top: 64px; transform: translate(-50%, -12px); opacity: 0;
        display: flex; gap: 12px; align-items: center; width: min(420px, calc(100vw - 32px)); box-sizing: border-box;
        padding: 10px 14px 10px 10px; border-radius: 16px; background: #fff6e2; pointer-events: none;
        box-shadow: 0 0 0 3px #8a6a3e, 0 8px 22px rgba(40, 28, 10, 0.35); transition: opacity 0.35s, transform 0.35s;
        font: 13px/1.55 "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #5a4024;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #toast img { width: 76px; height: 76px; flex: none; border-radius: 12px; background: #f1e4c4; }
      #toast small { display: block; font-weight: 800; color: #d2643a; letter-spacing: 1px; }
      #toast b { font-size: 16px; }
      #toast p { margin: 2px 0 0; }
      #book {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        background: rgba(30, 24, 12, 0.45); opacity: 0; pointer-events: none; transition: opacity 0.25s;
      }
      #book.open { opacity: 1; pointer-events: auto; }
      #book .page {
        position: relative; width: min(560px, 100%); box-sizing: border-box;
        padding: 30px 18px 18px; border-radius: 20px; background: #fff6e2;
        box-shadow: 0 0 0 4px #8a6a3e, 0 12px 32px rgba(30, 20, 8, 0.45);
        font: 13px/1.55 "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #5a4024;
      }
      #book .ribbon {
        position: absolute; left: 50%; top: -14px; transform: translateX(-50%); padding: 4px 20px; border-radius: 12px;
        font-weight: 800; font-size: 15px; letter-spacing: 3px; color: #fff8e6; background: #d2643a;
        box-shadow: 0 0 0 2px #8a3a1e, 0 2px 0 2px rgba(80, 30, 10, 0.4); white-space: nowrap;
      }
      #book .rows { display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 290px); overflow: auto; }
      #book h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 2px; color: #b08a5a; }
      /* One track per stretch of time, read left to right. */
      #book .track { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
      #book .slot {
        flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 84px; padding: 6px 4px; border: 0; border-radius: 12px;
        cursor: pointer; background: #f1e4c4; color: inherit; font: inherit; font-weight: 700; font-size: 12px; line-height: 1.3;
      }
      #book .slot:hover { background: #ead7ac; }
      #book .slot img { width: 60px; height: 60px; }
      #book .slot.echo { background: #e4e8d4; }
      #book .slot.echo:hover { background: #d6dcc0; }
      #book .icon { display: grid; place-items: center; width: 60px; height: 60px; color: #5e7a3a; }
      #book .icon svg { width: 34px; height: 34px; }
      #book .detail .icon { width: 96px; height: 96px; flex: none; }
      #book .detail .icon svg { width: 48px; height: 48px; }
      #book .missing img, #book .detail img.unknown { filter: brightness(0) opacity(0.28); }
      #book .missing .icon, #book .detail .icon.unknown { color: #c8b896; }
      #book .missing span { color: #a89070; }
      #book .slot small, #book .detail small { color: #b08a5a; font-size: 11px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
      #book .detail .transcript { white-space: pre-line; color: #6a5030; }
      #book .detail .gone { color: #a08868; }
      #book .detail .replay {
        display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 14px; border: 0; border-radius: 12px;
        cursor: pointer; font: inherit; font-weight: 700; color: #fff8e6; background: #d2643a;
      }
      #book .detail .replay svg { width: 14px; height: 14px; }
      #book .detail small { display: block; }
      #book .detail { display: flex; gap: 14px; align-items: center; min-height: 96px; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #f6ecd4; }
      #book .detail img { width: 96px; height: 96px; flex: none; }
      #book .detail b { font-size: 16px; }
      #book .detail p { margin: 4px 0 0; }
      #book .detail .lead { color: #a08868; }
      #book .close {
        position: absolute; right: 10px; top: 8px; width: 30px; height: 30px; border: 0; border-radius: 50%;
        font-size: 20px; line-height: 30px; cursor: pointer; background: transparent; color: #8a6a3e;
      }
      #radar.order { color: #b8352a; }
      #radar.hidden { opacity: 0; pointer-events: none; }
      /* A recording playing: what was detected, then the robot's transcript, over the scene. */
      #echo {
        position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 8px); z-index: 11; opacity: 0;
        width: min(560px, calc(100vw - 32px)); text-align: center; pointer-events: none; transition: opacity 0.6s, transform 0.6s;
      }
      #echo.show { opacity: 1; transform: translate(-50%, 0); }
      #echo .head { display: inline-block; padding: 3px 10px; border-radius: 6px; background: rgba(12, 14, 10, 0.7); font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: #9fe39a; }
      #echo .sub { margin-top: 10px; min-height: 1.6em; font: 600 18px/1.6 "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.6); }
      /* The robot's running system messages, under the radar. */
      /* --toast-h: the find card's height while it shows, so the lines step down below it. */
      #syslog { position: fixed; left: 50%; top: calc(58px + var(--toast-h, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 2; transition: top 0.35s; }
      #syslog p {
        margin: 0; padding: 3px 10px; border-radius: 6px; background: rgba(12, 14, 10, 0.62); white-space: nowrap;
        font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: #9fe39a; animation: storyIn 0.4s ease-out both; transition: opacity 0.8s;
      }
      #syslog p.warn { color: #ffb454; }
      #syslog p.out { opacity: 0; }
      /* Today's schedule: a small paper card ticking off the robot's day. */
      #routine {
        position: fixed; right: 16px; top: 72px; padding: 22px 14px 10px; border-radius: 14px; background: #fff6e2;
        box-shadow: 0 0 0 3px #8a6a3e, 0 6px 16px rgba(40, 28, 10, 0.3); opacity: 0; transform: translateY(-8px); pointer-events: none;
        font: 700 12px/1.5 "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #5a4024; transition: opacity 0.6s, transform 0.6s;
      }
      #routine.open { opacity: 1; transform: none; }
      #routine .ribbon {
        position: absolute; left: 50%; top: -12px; transform: translateX(-50%); padding: 2px 14px; border-radius: 10px; white-space: nowrap;
        font-weight: 800; letter-spacing: 2px; color: #fff8e6; background: #d2643a; box-shadow: 0 0 0 2px #8a3a1e;
      }
      #routine ul { margin: 0; padding: 0; list-style: none; }
      #routine .t { font-variant-numeric: tabular-nums; color: #b08a5a; font-weight: 600; }
      #routine .n { font-variant-numeric: tabular-nums; color: #b08a5a; font-weight: 600; }
      #routine li::before { content: "□ "; color: #b08a5a; }
      #routine li.done { color: #a08868; text-decoration: line-through; }
      #routine li.done::before { content: "☑ "; color: #6fae3e; }
      /* The robot's battery, always in the top-right corner: a cell gauge, its level and whether the sun is on it. */
      #battery {
        position: fixed; right: 16px; top: 14px; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px;
        border-radius: 15px; background: #fff6e2; box-shadow: 0 0 0 3px #8a6a3e, 0 4px 12px rgba(40, 28, 10, 0.3); pointer-events: none;
        font: 700 12px "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #5a4024; transition: opacity 0.6s;
      }
      #battery .cell { position: relative; width: 30px; height: 14px; box-sizing: border-box; border: 2px solid #8a6a3e; border-radius: 4px; padding: 1px; }
      #battery .cell::after { content: ""; position: absolute; right: -5px; top: 3px; width: 3px; height: 4px; border-radius: 0 2px 2px 0; background: #8a6a3e; }
      #battery .cell b { display: block; height: 100%; border-radius: 2px; background: #e0a02e; transition: width 0.4s, background 0.4s; }
      #battery .pct { font-variant-numeric: tabular-nums; min-width: 3ch; margin-left: 2px; }
      #battery .state { font-weight: 600; color: #b08a5a; }
      #battery[data-mode="charging"] .cell b { background: #6fae3e; animation: batteryPulse 1.4s ease-in-out infinite; }
      #battery[data-mode="charging"] .state::before { content: "☀ "; color: #e0a02e; }
      #battery[data-mode="full"] .cell b { background: #6fae3e; }
      #battery[data-mode="full"] .state { color: #6fae3e; }
      @keyframes batteryPulse { 50% { opacity: 0.55; } }
      /* Story log: the robot's system lines in terminal green, memories in plain text, the letter on paper. */
      #story {
        position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
        padding: 24px; box-sizing: border-box; background: rgba(12, 14, 10, 0.86); opacity: 0; pointer-events: none;
        transition: opacity 0.5s; cursor: pointer; z-index: 10;
      }
      #story.open { opacity: 1; pointer-events: auto; }
      #story .log { width: min(560px, 100%); }
      #story p { margin: 0 0 14px; animation: storyIn 0.6s ease-out both; white-space: pre-line; }
      #story .sys { font: 15px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: #9fe39a; letter-spacing: 0.5px; }
      #story .warn { color: #ffb454; }
      #story .line { font: 17px/1.8 "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #f2ede0; }
      #story .letter {
        padding: 18px 22px; border-radius: 6px; background: #f3ead2; color: #3a2a1c; transform: rotate(-0.6deg);
        font: 17px/1.9 "Kaiti TC", "BiauKai", "PingFang TC", serif; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      /* At her door the scene stays in view; while the recording plays, only the recording. */
      #story.soft { background: rgba(12, 14, 10, 0.6); }
      #story.listening { background: rgba(12, 14, 10, 0.25); }
      #story.listening .log, #story.listening .next { opacity: 0; }
      #story .log, #story .next { transition: opacity 0.6s; }
      #story .choices { display: flex; gap: 12px; }
      #story .act {
        padding: 8px 20px; border: 1px solid #9fe39a; border-radius: 6px; cursor: pointer; background: transparent;
        font: 15px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: #9fe39a;
      }
      #story .act:hover { background: rgba(159, 227, 154, 0.15); }
      #story .next { margin-top: 18px; font: 13px system-ui, sans-serif; color: rgba(242, 237, 224, 0.6); animation: storyBlink 1.6s infinite; }
      @keyframes storyIn { from { opacity: 0; transform: translateY(6px); } }
      @keyframes storyBlink { 50% { opacity: 0.4; } }
      /* Narrow screens: the radar and its card drop below the minimap's corner. */
      /* Mid-width screens: the hint sits above the bottom-right controls instead of under them. */
      @media (max-width: 900px) {
        #hint { bottom: 72px; max-width: calc(100vw - 32px); }
      }
      @media (max-width: 640px) {
        #hint { display: none; }
        #radar { top: auto; bottom: 76px; }
        #toast { top: auto; bottom: 122px; }
        #syslog { top: 14px; }
        #routine { top: auto; bottom: 122px; right: 16px; }
        #echo { bottom: 128px; }
      }
      /* Settings: language, sound and the mixer, in the book's paper style, above the controls. */
      #settings {
        position: fixed; right: 16px; bottom: 76px; z-index: 16; width: min(300px, calc(100vw - 32px)); box-sizing: border-box;
        padding: 26px 16px 12px; border-radius: 16px; background: #fff6e2;
        box-shadow: 0 0 0 3px #8a6a3e, 0 8px 22px rgba(40, 28, 10, 0.35);
        font: 700 13px "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #5a4024;
        opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 0.2s, transform 0.2s;
      }
      #settings.open { opacity: 1; transform: none; pointer-events: auto; }
      /* Opened from the title menu: centred over it. */
      body.titled #settings { right: auto; bottom: auto; left: 50%; top: 50%; translate: -50% -50%; }
      /* …in place of the menu: its buttons step aside while the panel is open. */
      #menu .box { transition: opacity 0.2s; }
      body:has(#settings.open) #menu .box { opacity: 0; pointer-events: none; }
      #settings .ribbon {
        position: absolute; left: 50%; top: -14px; transform: translateX(-50%); padding: 3px 18px; border-radius: 12px;
        font-weight: 800; letter-spacing: 2px; color: #fff8e6; background: #d2643a; white-space: nowrap;
        box-shadow: 0 0 0 2px #8a3a1e, 0 2px 0 2px rgba(80, 30, 10, 0.4);
      }
      #settings .close {
        position: absolute; right: 8px; top: 6px; width: 28px; height: 28px; border: 0; border-radius: 50%;
        font-size: 20px; line-height: 28px; cursor: pointer; background: transparent; color: #8a6a3e;
      }
      #settings .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
      #settings .choice { display: flex; padding: 3px; border-radius: 14px; background: #f1e4c4; }
      #settings .choice button {
        padding: 4px 12px; border: 0; border-radius: 11px; cursor: pointer; font: inherit; color: #8a6a3e; background: transparent;
      }
      #settings .choice button[aria-pressed="true"] { cursor: default; color: #fff8e6; background: #d2643a; }
      /* Sound switch: a pill with a sliding knob. */
      #settings input[role="switch"] {
        appearance: none; position: relative; width: 42px; height: 24px; margin: 0; border-radius: 12px; cursor: pointer;
        background: #e2d4b4; transition: background 0.2s;
      }
      #settings input[role="switch"]::after {
        content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%;
        background: #fff; box-shadow: 0 1px 2px rgba(40, 28, 10, 0.3); transition: transform 0.2s;
      }
      #settings input[role="switch"]:checked { background: #6fae3e; }
      #settings input[role="switch"]:checked::after { transform: translateX(18px); }
      #settings .level { display: grid; grid-template-columns: 76px 1fr 40px; align-items: center; gap: 10px; padding: 5px 0; }
      /* The master volume, set apart from the language and sound above and the channels below. */
      #settings .row + .level { margin: 6px 0 4px; padding: 12px 0 10px; border-block: 2px dashed #e2d4b4; }
      #settings input[type="range"] { width: 100%; accent-color: #d2643a; }
      #settings output { text-align: right; font-variant-numeric: tabular-nums; color: #a08868; }
      #settings .reset {
        display: block; margin: 8px auto 0; padding: 5px 14px; border: 0; border-radius: 12px; cursor: pointer;
        font: inherit; color: #8a6a3e; background: #f1e4c4;
      }
      #settings .reset:hover { background: #ead7ac; }
      /* The scene's map data credit, at the foot of the panel. */
      #settings .credit { margin: 10px 0 0; text-align: center; font-weight: 400; font-size: 11px; color: #a08868; }
      #settings .credit a { color: inherit; }
      /* Loading screen: shown from the first paint, filled by src/loading.js as the scene builds. */
      #loading {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: #2c3320; transition: opacity 0.6s;
        font: 13px/1.5 "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #fff6e2;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .box { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(320px, calc(100vw - 32px)); }
      #loading .title { font-weight: 800; font-size: 18px; letter-spacing: 4px; }
      #loading .bar {
        width: 100%; height: 14px; padding: 3px; box-sizing: border-box; border-radius: 10px;
        background: #fff6e2; box-shadow: 0 0 0 3px #8a6a3e;
      }
      #loading .bar i {
        position: relative; display: block; overflow: hidden; height: 100%; width: 0;
        border-radius: 6px; background: #d2643a; transition: width 0.3s ease-out;
      }
      /* A transform animation runs off the main thread, so the shine keeps moving while a step builds. */
      #loading .bar i::after {
        content: ""; position: absolute; inset: 0; animation: loadingShine 1.2s linear infinite;
        background: linear-gradient(90deg, transparent, rgba(255, 246, 226, 0.45), transparent);
      }
      @keyframes loadingShine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      #loading .label { color: rgba(255, 246, 226, 0.7); }
      /* Title menu: over the idling scene, with the HUD tucked away until play begins. */
      #menu {
        /* The menu sits in the lower part of the screen, leaving the robot in view above it. */
        position: fixed; inset: 0; z-index: 15; display: grid; place-items: end center; padding: 16px 16px 14vh;
        background: linear-gradient(to bottom, rgba(28, 34, 18, 0) 35%, rgba(28, 34, 18, 0.7));
        transition: opacity 0.6s;
        font: 13px/1.5 "PingFang TC", "Heiti TC", system-ui, sans-serif; color: #fff6e2;
      }
      #menu.done { opacity: 0; pointer-events: none; }
      #menu .box { display: flex; flex-direction: column; align-items: center; gap: 22px; width: min(320px, 100%); }
      #menu .title { white-space: nowrap; font-weight: 800; font-size: clamp(24px, 7vw, 34px); letter-spacing: 0.25em; text-shadow: 0 2px 0 #8a3a1e, 0 6px 18px rgba(20, 10, 4, 0.6); }
      #menu .choices { display: flex; flex-direction: column; align-items: stretch; gap: 10px; width: 220px; }
      #menu p { margin: 0 0 4px; text-align: center; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
      #menu button {
        height: 44px; border: 0; border-radius: 22px; cursor: pointer;
        font: 800 15px "PingFang TC", "Heiti TC", system-ui, sans-serif; letter-spacing: 2px;
        color: #5a4024; background: #fff6e2; box-shadow: 0 0 0 3px #8a6a3e, 0 4px 12px rgba(40, 28, 10, 0.35);
      }
      #menu button:hover:not(:disabled) { background: #f1e4c4; }
      #menu button.primary { color: #fff8e6; background: #d2643a; box-shadow: 0 0 0 3px #8a3a1e, 0 4px 12px rgba(40, 28, 10, 0.35); }
      #menu button.primary:hover { background: #dc7248; }
      #menu button:disabled { cursor: default; opacity: 0.5; }
      body.titled #hint, body.titled #minimap, body.titled #radar, body.titled #controls,
      body.titled #syslog, body.titled #routine, body.titled #battery { opacity: 0 !important; pointer-events: none !important; }
      #settings-button {
